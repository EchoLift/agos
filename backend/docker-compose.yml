version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: agos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: agency_os
      POSTGRES_USER: agency_os
      POSTGRES_PASSWORD: agency_os
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: agos-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: agos-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: agency_os
      RABBITMQ_DEFAULT_PASS: agency_os
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  postgres_data: